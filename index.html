<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noite-fundo:#0e1433;--painel:#232c66;--painel-2:#2c3679;
  --ouro:#f3c96a;--ouro-forte:#e0a93f;--coral:#e8705f;--peri:#8f9ce8;--mel:#e3b256;
  --texto:#f1efff;--texto-fraco:#a9b0dd;--rosa:#ec4f92;--verde:#5fd08a;--r:14px;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:radial-gradient(120% 70% at 50% -10%, #2a3480 0%, transparent 60%),
    linear-gradient(180deg,#18205a 0%, var(--noite-fundo) 100%);
  background-attachment:fixed;color:var(--texto);
  font-family:Quicksand,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:600;
  min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
a{color:var(--ouro)}
.topo{position:sticky;top:0;z-index:30;
  background:#151c4a;
  border-bottom:2px solid rgba(243,201,106,.45);
  padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.marca{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.marca b{font-size:17px}
.marca span{font-size:11px;color:var(--texto-fraco);font-weight:600}
.faisca{width:22px;height:22px;flex:none}
.abas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:0 0 auto;border:0;background:transparent;color:var(--texto-fraco);
  font:inherit;font-size:13px;padding:9px 13px 11px;border-radius:12px 12px 0 0;
  cursor:pointer;white-space:nowrap}
.aba[aria-selected="true"]{background:linear-gradient(180deg,var(--ouro) 0%,var(--ouro-forte) 100%);
  color:#2a1c00;box-shadow:0 -2px 0 #fff5d6 inset}
main{padding:14px 12px 0;max-width:760px;margin:0 auto}
h2.secao{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 10px}
h2.secao:first-child{margin-top:4px}
h2.secao .conta{margin-left:auto;font-size:11px;color:var(--texto-fraco);
  background:rgba(0,0,0,.25);padding:3px 9px;border-radius:20px}
.barra{height:7px;border-radius:20px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 2px}
.barra i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--ouro),#fff0c4);transition:width .35s}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.area{position:relative;border:2px solid var(--peri);border-radius:var(--r);
  background:linear-gradient(160deg,var(--painel-2),var(--painel));
  padding:34px 10px 10px;text-align:left;cursor:pointer;color:inherit;font:inherit;
  min-height:92px;display:flex;align-items:flex-end;transition:transform .12s}
.area:active{transform:scale(.97)}
.area .nome{font-size:13px;line-height:1.25}
.area .custo{position:absolute;top:7px;right:9px;font-size:11px;color:#ffe9a8;
  background:rgba(0,0,0,.35);padding:2px 8px;border-radius:20px}
.area[data-on="0"]{filter:grayscale(.85);opacity:.5}
.area[data-on="1"]::before{content:"";position:absolute;top:8px;left:9px;width:16px;height:16px;
  background:var(--ouro);border-radius:50%;box-shadow:0 0 0 3px rgba(243,201,106,.25)}
.tema-historias .area{border-color:var(--coral)}
.tema-mel .area{border-color:var(--mel)}
.tema-reino .area{border-color:#a7b2f0}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.chip{border:1.5px solid rgba(143,156,232,.5);background:rgba(0,0,0,.2);color:var(--texto-fraco);
  font:inherit;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:#2a1c00}
.busca{width:100%;padding:11px 14px;border-radius:20px;font:inherit;font-size:14px;
  background:rgba(0,0,0,.3);border:1.5px solid rgba(143,156,232,.45);color:var(--texto)}
.busca::placeholder{color:#7e88bd}
textarea.caixa-texto{width:100%;height:130px;border-radius:12px;padding:10px 12px;
  background:rgba(0,0,0,.35);border:1.5px solid rgba(143,156,232,.45);color:var(--texto);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.4;resize:vertical}
.controles #soLiberados{width:100%;padding:10px;font-size:13px;margin-bottom:9px}
.controles #ordem{width:100%;margin-top:9px;padding:9px 12px}
.p{border:2px solid rgba(143,156,232,.55);border-radius:var(--r);
  background:linear-gradient(160deg,var(--painel-2),var(--painel));margin-bottom:8px;overflow:hidden}
.p[data-on="0"]{border-color:rgba(143,156,232,.22);background:rgba(20,26,66,.6)}
.p-topo{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.estrela{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:13px;color:#fff;
  background:var(--rosa);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.p[data-on="0"] .estrela{background:#4a5290;color:#98a0d4}
.p-nome{flex:1;min-width:0}
.p-nome b{display:block;font-size:15px}
.p-nome small{color:var(--texto-fraco);font-size:11.5px;font-weight:600}
.p-sino{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.3);color:var(--texto-fraco)}
.p-sino.pend{background:rgba(232,112,95,.25);color:#ffb9ad}
.p-sino.ok{background:rgba(95,208,138,.2);color:#a9f0c4}
.p-corpo{padding:0 12px 12px;border-top:1px solid rgba(143,156,232,.25);padding-top:11px}
.linha{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.rot{font-size:11.5px;color:var(--texto-fraco);min-width:90px}
.passo{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.3);border-radius:20px;padding:3px}
.passo button{width:30px;height:28px;border:0;border-radius:16px;background:rgba(143,156,232,.2);
  color:var(--texto);font:inherit;font-size:16px;cursor:pointer;line-height:1}
.passo span{min-width:34px;text-align:center;font-size:14px}
select{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:20px;
  background:rgba(0,0,0,.35);color:var(--texto);border:1.5px solid rgba(143,156,232,.45)}
.missao{display:flex;align-items:flex-start;gap:9px;padding:7px 0;
  border-top:1px dashed rgba(143,156,232,.22);font-size:13px;font-weight:600}
.missao:first-of-type{border-top:0}
.cx{flex:none;width:19px;height:19px;margin-top:1px;border-radius:6px;cursor:pointer;
  border:2px solid var(--peri);background:transparent;display:grid;place-items:center;
  color:#1a2050;font-size:12px;line-height:1;padding:0}
.cx[aria-checked="true"]{background:var(--verde);border-color:var(--verde)}
.cx.fazendo{background:var(--ouro);border-color:var(--ouro);color:#2a1c00}
.missao.fazendo label{color:var(--ouro)}
.agora{font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;
  border-radius:20px;background:rgba(243,201,106,.2);color:var(--ouro);margin-left:auto;flex:none}
.missao.feita label{opacity:.45;text-decoration:line-through}
.missao a{font-size:11px;color:var(--peri);text-decoration:none;flex:none;margin-top:2px}
.vazio{color:var(--texto-fraco);font-size:12.5px;padding:8px 0}
.req{font-size:10.5px;color:var(--texto-fraco);opacity:.8;margin-top:2px;line-height:1.4;font-weight:600}
.fr{display:flex;align-items:center;gap:8px;font-size:13px;color:#d9d6ff;
  margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid rgba(243,201,106,.3)}
.fr span{margin-left:auto;font-size:11px;color:var(--ouro)}
.caixa{border:2px solid rgba(243,201,106,.4);border-radius:var(--r);
  background:linear-gradient(160deg,var(--painel-2),var(--painel));padding:14px;margin-bottom:10px}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.numeros div b{display:block;font-size:22px;color:var(--ouro)}
.numeros div span{font-size:11px;color:var(--texto-fraco)}

/* ---------- tela larga: duas colunas ---------- */
@media (min-width:700px){
  main{max-width:1180px;
    padding-left:calc(16px + env(safe-area-inset-left,0px));
    padding-right:calc(16px + env(safe-area-inset-right,0px))}
  #lista-pers, #lista-guia, #v-miss:not(.oculto), #v-prog:not(.oculto){
    display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  #lista-pers > h2, #lista-pers > .fr, #lista-pers > .vazio, #lista-pers > .p.aberto,
  #lista-guia > .nota, #lista-guia > .vazio, #lista-guia > .caixa,
  #v-miss > h2, #v-miss > .nota, #v-miss > .vazio,
  #v-prog > .caixa:first-child{grid-column:1 / -1}

  .controles{display:flex;gap:10px;align-items:center}

}

/* Ordem da Colecao do jogo: regioes na ordem da barra lateral,
   franquias e personagens em ordem alfabetica. Excecoes observadas nos prints: */
const ORD_REG=['Dreamlight Valley','Eternity Isle','Storybook Vale','Wishblossom Mountains','Honeyglow Woods'];
const EXCECAO={vanellope:0, ralph:1};   // no jogo a Vanellope vem antes do Ralph
function ordenar(l){
  const modo=(E.ui&&E.ui.ordem)||'jogo';
  const cmp=(a,b)=>a.localeCompare(b,'en',{sensitivity:'base'});
  const nome=(a,b)=>{
    if(a.f===b.f && a.id in EXCECAO && b.id in EXCECAO) return EXCECAO[a.id]-EXCECAO[b.id];
    return cmp(a.n,b.n);
  };
  if(modo==='destrava') return l.slice().sort((a,b)=>ORDEM.indexOf(a.id)-ORDEM.indexOf(b.id));
  if(modo==='franquia') return l.slice().sort((a,b)=>cmp(a.f,b.f)||nome(a,b));
  const r=c=>ORD_REG.indexOf(regiao(c));
  return l.slice().sort((a,b)=>r(a)-r(b)||cmp(a.f,b.f)||nome(a,b));
}

/* completar() so preenche o que falta no objeto que ja esta em E.
   carregar() e' quem le o aparelho — nunca chame carregar() depois de
   trocar E por um backup, senao o estado antigo volta por cima. */
function completar(){
  if(!E.areas) E.areas={}; if(!E.pers) E.pers={}; if(!E.ui) E.ui={};
  AREAS.forEach(g=>g.itens.forEach(a=>{
    const k=g.g+'|'+a.n;
    if(E.areas[k]===undefined) E.areas[k]=a.on;
  }));
  CHARS.forEach(c=>{ if(!E.pers[c.id]) E.pers[c.id]={on:c.on,lvl:c.lvl,fn:'—',q:{}}; });
}
function carregar(){
  try{ const b=localStorage.getItem(CHAVE); if(b) E=JSON.parse(b); }catch(e){}
  completar();
}

function marcaSync(){
  const el=document.getElementById('sync'); if(!el) return;
  el.textContent = syncMsg || 'Dreamlight Valley tracker & guide';
  el.style.color = (syncMsg==='could not save') ? '#ffb9ad' : '';
}
function salvar(){
  try{ localStorage.setItem(CHAVE,JSON.stringify(E)); }catch(e){}
  if(DBREF){
    syncMsg='saving\u2026'; marcaSync();
    clearTimeout(tSalvar); tSalvar=setTimeout(()=>{ tSalvar=null; salvarRemoto(); },700);
  } else if(gsAtivo){
    syncMsg='saving\u2026'; marcaSync();
    clearTimeout(tSalvar); tSalvar=setTimeout(()=>{ tSalvar=null; gsGravar(); },800);
  }
}
async function salvarRemoto(){
  if(!DBREF) return;
  try{
    const corpo=JSON.stringify(E);
    ultimoPayload=corpo;
    await DBREF.set({payload:corpo, updated:Date.now()});
    syncMsg='saved';
    setTimeout(()=>{ if(syncMsg==='saved'){ syncMsg=''; marcaSync(); } },1800);
  }catch(e){ syncMsg='could not save'; }
  marcaSync();
}
(async()=>{
  let db=null;
  try{ db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }
  catch(e){ db=null; }
  if(!db) return;
  DBREF = db.doc('state/tracker');
  try{
    const snap = await DBREF.get();
    const d = snap.exists ? snap.data() : null;
    if(d && typeof d.payload === 'string'){
      ultimoPayload = d.payload;
      const remoto = JSON.parse(d.payload);
      if(remoto && remoto.pers){ E = remoto; completar(); verTudo(); }
    }else{
      await salvarRemoto();
    }
  }catch(e){}
  // sincronia ao vivo entre aparelhos
  try{
    DBREF.onSnapshot(s=>{
      if(!s.exists) return;
      const d=s.data(); if(!d || typeof d.payload!=='string') return;
      if(d.payload===ultimoPayload) return;          // eco do nosso proprio write
      if(tSalvar) return;                            // gravacao local ainda pendente, ela manda
      let remoto; try{ remoto=JSON.parse(d.payload); }catch(e){ return; }
      if(!remoto || !remoto.pers) return;
      ultimoPayload=d.payload;
      E=remoto; completar(); verTudo();
      syncMsg='updated from your other device'; marcaSync();
      setTimeout(()=>{ if(syncMsg.indexOf('updated')===0){ syncMsg=''; marcaSync(); } },2500);
    }, e=>{ syncMsg='sync interrupted'; marcaSync(); });
  }catch(e){}
})();

  setTimeout(gsIniciar, 1200);
})();

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- planilha do Google (usada fora do Claude) ---------- */
const GS_URL='https://script.google.com/macros/s/AKfycbxw4auON2fGhLS-XSQhmQGxGpVEO9zk6apuejsXfsX83SM4_OSMdCdz9ow-5-PEfpRk/exec';
const GS_KEY='my-valley-gs-senha';
let GS_SENHA=null, gsUltimo=null, gsTimer=null, gsAtivo=false, primeiraLigacao=true;

function riqueza(est){
  let n=0;
  try{
    Object.keys(est.pers||{}).forEach(k=>{
      const x=est.pers[k]||{};
      if(x.on) n++;
      if(x.fn && x.fn!=='\u2014') n++;
      n += Object.keys(x.q||{}).length;
      n += (x.lvl||0);
    });
    n += Object.values(est.areas||{}).filter(Boolean).length;
  }catch(e){}
  return n;
}
function guardaResgate(){
  try{ localStorage.setItem('my-valley-resgate', JSON.stringify(E)); }catch(e){}
}
function gsLerSenha(){ try{ return localStorage.getItem(GS_KEY); }catch(e){ return null; } }
function gsSalvarSenha(s){ try{ localStorage.setItem(GS_KEY,s); }catch(e){} }

async function gsBuscar(){
  const r=await fetch(GS_URL+'?senha='+encodeURIComponent(GS_SENHA),{cache:'no-store'});
  const d=await r.json();
  if(d.erro) throw new Error(d.erro);
  return d;
}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function gsConfere(payload){
  try{ const d=await gsBuscar(); return d.payload===payload; }catch(e){ return false; }
}
async function gsGravar(){
  const payload=JSON.stringify(E);
  const corpo=JSON.stringify({senha:GS_SENHA, payload});
  const opcoes={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:corpo};
  let ok=false;
  try{
    const r=await fetch(GS_URL,opcoes);
    const d=await r.json();
    if(d.erro) throw new Error(d.erro);
    ok=true;
  }catch(e){
    // O Apps Script costuma gravar e responder de outro endereço, que o
    // navegador bloqueia. Em vez de confiar na resposta, lemos de volta.
    await espera(1200);
    ok=await gsConfere(payload);
    if(!ok){
      try{ await fetch(GS_URL,Object.assign({},opcoes,{mode:'no-cors'})); }catch(e2){}
      await espera(1500);
      ok=await gsConfere(payload);
    }
  }
  if(ok){
    gsUltimo=payload;
    syncMsg='saved';
    setTimeout(()=>{ if(syncMsg==='saved'){ syncMsg=''; marcaSync(); } },1800);
  }else{
    syncMsg='could not save';
  }
  marcaSync();
}
async function gsConferir(){
  if(tSalvar) return;
  try{
    const d=await gsBuscar();
    if(!d.payload || d.payload===gsUltimo) return;
    const remoto=JSON.parse(d.payload);
    if(!remoto || !remoto.pers) return;
    gsUltimo=d.payload; E=remoto; completar(); verTudo();
    syncMsg='updated from your other device'; marcaSync();
    setTimeout(()=>{ if(syncMsg.indexOf('updated')===0){ syncMsg=''; marcaSync(); } },2500);
  }catch(e){}
}
async function gsIniciar(){
  if(DBREF) return;
  GS_SENHA=gsLerSenha();
  if(!GS_SENHA){ verProg(); return; }
  try{
    const d=await gsBuscar();
    if(d.payload){
      gsUltimo=d.payload;
      const remoto=JSON.parse(d.payload);
      if(remoto && remoto.pers){
        const aqui=riqueza(E), la=riqueza(remoto);
        if(primeiraLigacao && la < aqui){
          guardaResgate();
          const usarPlanilha = confirm(
            'The spreadsheet looks emptier than this device.\n\n'+
            'Spreadsheet: '+la+' marks\nThis device: '+aqui+' marks\n\n'+
            'OK = use the spreadsheet and lose what is on this device.\n'+
            'Cancel = keep this device and write it over the spreadsheet.');
          if(usarPlanilha){ E=remoto; completar(); }
          else { gsAtivo=true; verTudo(); await gsGravar(); primeiraLigacao=false;
                 clearInterval(gsTimer); gsTimer=setInterval(gsConferir,20000); return; }
        }else{
          guardaResgate();
          E=remoto; completar();
        }
      }
    }
    primeiraLigacao=false;
    gsAtivo=true;
    verTudo();
    if(!d.payload) gsGravar();
    clearInterval(gsTimer); gsTimer=setInterval(gsConferir,20000);
  }catch(e){
    gsAtivo=false;
    syncMsg = (String(e).indexOf('senha')>-1) ? 'wrong password' : 'spreadsheet offline';
    marcaSync(); verProg();
  }
}
async function gsConectar(){
  const s=prompt('Password you set in the Apps Script file:');
  if(!s) return;
  GS_SENHA=s.trim();
  try{
    await gsBuscar();
    gsSalvarSenha(GS_SENHA);
    await gsIniciar();
    alert('Connected. Your progress now syncs through your spreadsheet.');
  }catch(e){
    alert(String(e).indexOf('senha')>-1 ? 'That password was refused by the script.' : 'Could not reach the spreadsheet.');
  }
}

function verAreas(){
  const el=document.getElementById('v-areas');
  el.innerHTML=AREAS.map(g=>{
    const abertas=g.itens.filter(a=>E.areas[g.g+'|'+a.n]).length;
    const pct=Math.round(abertas/g.itens.length*100);
    return `<h2 class="secao">${g.g}<span class="conta">${abertas} of ${g.itens.length}</span></h2>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="grade ${g.tema}">`+g.itens.map(a=>{
      const k=g.g+'|'+a.n, on=E.areas[k]?1:0;
      return `<button class="area" data-on="${on}" data-k="${esc(k)}">
        ${a.c&&!on?`<span class="custo">✦ ${a.c}</span>`:''}
        <span class="nome">${esc(a.n)}</span></button>`;
    }).join('')+`</div>`;
  }).join('');
  el.querySelectorAll('.area').forEach(b=>b.onclick=()=>{
    E.areas[b.dataset.k]=E.areas[b.dataset.k]?0:1; salvar(); verAreas();
  });
}

let filtro='todos', termo='', aberto=null;
const FILTROS=[['todos','All'],['doing','In progress'],['on','Unlocked'],['off','Missing'],['pend','Quests pending'],['hist','Storybook Vale']];

function verFiltros(){
  document.getElementById('filtros').innerHTML=FILTROS.map(([k,r])=>
    `<button class="chip" data-f="${k}" aria-pressed="${filtro===k}">${r}</button>`).join('');
  document.querySelectorAll('#filtros .chip').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;verFiltros();verPers();});
}
function pendentes(c){ return c.q.filter(t=>E.pers[c.id].q[t]!==1).length; }
function fazendo(c){ return c.q.filter(t=>E.pers[c.id].q[t]===2); }
function todasFazendo(){
  const r=[]; CHARS.forEach(c=>{ if(E.pers[c.id].on) fazendo(c).forEach(t=>r.push([c,t])); });
  return r;
}

function verPers(){
  const alvo=document.getElementById('lista-pers');
  const t=termo.toLowerCase();
  const lista=CHARS.filter(c=>{
    const p=E.pers[c.id];
    if(filtro==='on'&&!p.on) return false;
    if(filtro==='off'&&p.on) return false;
    if(filtro==='pend'&&(!p.on||pendentes(c)===0)) return false;
    if(filtro==='doing'&&(!p.on||fazendo(c).length===0)) return false;
    if(E.ui.soLiberados && filtro!=='off' && !p.on) return false;
    if(filtro==='hist'&&!c.hist) return false;
    if(t&&!(c.n.toLowerCase().includes(t)||c.f.toLowerCase().includes(t))) return false;
    return true;
  });
  if(!lista.length){ alvo.innerHTML='<p class="vazio">No characters match this filter.</p>'; return; }
  const porRegiao=((E.ui&&E.ui.ordem)||'jogo')!=='franquia';
  let h='', regAtual='', frAtual='';
  ordenar(lista).forEach(c=>{
    const p=E.pers[c.id], pd=pendentes(c), ab=aberto===c.id, r=regiao(c);
    if(porRegiao && r!==regAtual){
      regAtual=r; frAtual='';
      const grp=CHARS.filter(x=>regiao(x)===r);
      h+=`<h2 class="secao">${esc(r)}<span class="conta">${grp.filter(x=>E.pers[x.id].on).length} of ${grp.length}</span></h2>`;
    }
    if(c.f!==frAtual){
      frAtual=c.f;
      const g=CHARS.filter(x=>(porRegiao?regiao(x)===r:true)&&x.f===c.f);
      h+=`<div class="fr">${esc(c.f)}<span>${g.filter(x=>E.pers[x.id].on).length}/${g.length}</span></div>`;
    }
    const nf = fazendo(c).length;
    const sino = !p.on ? '<span class="p-sino">locked</span>'
      : nf ? `<span class="p-sino" style="background:rgba(243,201,106,.2);color:var(--ouro)">${nf} in progress</span>`
      : pd ? `<span class="p-sino pend">${pd} quest${pd>1?'s':''}</span>`
      : '<span class="p-sino ok">all done</span>';
    let sub = !p.on ? 'not unlocked yet'
      : (p.fn&&p.fn!=='—') ? 'companion role: '+p.fn : 'no companion role set';
    if(!porRegiao && r!=='Dreamlight Valley') sub = r+' \u00b7 '+sub;
    h+=`<article class="p${ab?' aberto':''}" data-on="${p.on?1:0}">
      <div class="p-topo" data-id="${c.id}">
        <div class="estrela">${p.on?p.lvl:''}</div>
        <div class="p-nome"><b>${esc(c.n)}</b><small>${esc(sub)}</small></div>
        ${sino}
      </div>${ab?corpo(c,p):''}</article>`;
  });
  alvo.innerHTML=h;

  alvo.querySelectorAll('.p-topo').forEach(h=>h.onclick=()=>{
    aberto = aberto===h.dataset.id ? null : h.dataset.id; verPers();
  });
  alvo.querySelectorAll('[data-acao]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const p=E.pers[b.dataset.id], a=b.dataset.acao;
    if(a==='on'){ p.on=!p.on; if(p.on&&p.lvl===0)p.lvl=1; }
    if(a==='mais') p.lvl=Math.min(10,p.lvl+1);
    if(a==='menos') p.lvl=Math.max(0,p.lvl-1);
    salvar(); verPers();
  });
  alvo.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>{
    E.pers[s.dataset.id].fn=s.value; salvar();
  });
  alvo.querySelectorAll('.cx').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const p=E.pers[b.dataset.id], t=b.dataset.q;
    const st=p.q[t];
    if(!st) p.q[t]=2; else if(st===2) p.q[t]=1; else delete p.q[t];
    salvar(); verPers();
  });
}

    <div class="linha">
      <button class="botao ${p.on?'':'cheio'}" data-acao="on" data-id="${c.id}">${p.on?'Mark as locked':'Mark as unlocked'}</button>
    </div>
    ${p.on?`
    <div class="linha"><span class="rot">Friendship</span>
      <div class="passo">
        <button data-acao="menos" data-id="${c.id}" aria-label="Lower level">−</button>
        <span>${p.lvl}</span>
        <button data-acao="mais" data-id="${c.id}" aria-label="Raise level">+</button>
      </div>
    </div>
    <div class="linha"><span class="rot">Companion role</span>
      <select data-id="${c.id}">${FUNCOES.map(f=>`<option ${p.fn===f?'selected':''}>${f}</option>`).join('')}</select>
    </div>`:''}
    ${GIFTS[c.id]?`<div class="linha" style="align-items:flex-start"><span class="rot">Gift pool</span>
      <span style="flex:1;min-width:0;font-size:12.5px;color:#e7e4ff;line-height:1.5">${esc(GIFTS[c.id])}</span></div>`:''}
    <div class="linha" style="margin-bottom:4px"><span class="rot">Friendship quests</span></div>
    ${c.q.map((t,idx)=>`<div class="missao ${p.q[t]===1?'feita':p.q[t]===2?'fazendo':''}">
      <button class="cx ${p.q[t]===2?'fazendo':''}" role="checkbox" aria-checked="${p.q[t]===1?'true':'false'}" data-id="${c.id}" data-q="${esc(t)}">${p.q[t]===1?'✓':p.q[t]===2?'•':''}</button>
      <div style="flex:1;min-width:0">
        <label>${esc(t)}</label>
        <div class="req">${esc(reqTexto(t,idx))}</div>
      </div>
      <a href="${wiki(t)}" target="_blank" rel="noopener">wiki</a>
    </div>`).join('')}
    <p class="req" style="margin:9px 0 0">Tap a box once to mark a quest as in progress, again to mark it done, again to clear it. Friendship quests open at levels 2, 4, 7 and 10, in this order. Anything beyond the fourth is an event or village project. Some also need other villagers at a certain level \u2014 in game, the Quests tab shows the exact requirement next to a locked quest.</p>
  </div>`;
}

function verMiss(){
  const el=document.getElementById('v-miss');
  const abertos=CHARS.filter(c=>E.pers[c.id].on);
  const comPend=abertos.filter(c=>c.q.some(t=>!E.pers[c.id].q[t])).sort((a,b)=>E.pers[b.id].lvl-E.pers[a.id].lvl);
  const agora=todasFazendo();
  let h = agora.length ? `<h2 class="secao">Working on now<span class="conta">${agora.length}</span></h2>
    <div class="caixa">${agora.map(([c,t])=>`<div class="missao">
      <button class="cx fazendo" role="checkbox" aria-checked="false" data-id="${c.id}" data-q="${esc(t)}">•</button>
      <div style="flex:1;min-width:0"><label>${esc(t)}</label>
        <div class="req">${esc(c.n)} \u00b7 friendship ${E.pers[c.id].lvl}</div></div>
      <a href="${wiki(t)}" target="_blank" rel="noopener">how to</a>
    </div>`).join('')}</div>` : '';
  h += `<h2 class="secao">What's left<span class="conta">${comPend.length} characters</span></h2>
  <p class="nota" style="margin:0 0 12px">Tap a box to move a quest between in progress and done, same as on the character. Sorted by friendship level, highest first — that's usually where a quest is blocked by something else: a locked biome, another villager at a low level, or an ingredient that only grows somewhere you can't reach yet.</p>`;
  if(!comPend.length){
    h+='<p class="vazio">Nothing pending among your unlocked characters.</p>';
  }else{
    h+=comPend.map(c=>{
      const p=E.pers[c.id], faltam=c.q.filter(t=>!p.q[t]);
      if(!faltam.length) return '';
      return `<div class="caixa">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
          <div class="estrela">${p.lvl}</div>
          <div class="p-nome"><b>${esc(c.n)}</b><small>${esc(c.f)}</small></div>
        </div>
        ${faltam.map(t=>`<div class="missao ${p.q[t]===2?'fazendo':''}">
          <button class="cx ${p.q[t]===2?'fazendo':''}" role="checkbox" aria-checked="false" data-id="${c.id}" data-q="${esc(t)}">${p.q[t]===2?'•':''}</button>
          <label style="flex:1;min-width:0">${esc(t)}</label>
          <a href="${wiki(t)}" target="_blank" rel="noopener">how to</a>
        </div>`).join('')}
      </div>`;
    }).join('');
  }
  el.innerHTML=h;
  el.querySelectorAll('.cx[data-id]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const pp=E.pers[b.dataset.id], t=b.dataset.q, st=pp.q[t];
    if(!st) pp.q[t]=2; else if(st===2) pp.q[t]=1; else delete pp.q[t];
    salvar(); verMiss(); verPers(); verProg();
  });
}

let INDEX=[];
function montarIndice(){
  INDEX=[];
  FISH.forEach(([n,loc,rip,g,en,dlc])=>INDEX.push({
    t:'fish',n,sub:'Fish'+(dlc?' · expansion':''),
    meta:[['Where',loc],['Ripple',rip],['Sells',coin(g)?coin(g)+' coins':'cannot be sold'],['Energy',en?'+'+coin(en):null]],
    val:{sell:g,energy:en},s:(n+' '+loc+' '+rip+' fish').toLowerCase()
  }));
  CROPS.forEach(([n,kind,where,cost,time,yld,sell,en])=>{
    const label=kind==='seed'?'Seed':kind==='buy'?'Bought item':'Foraged '+kind;
    INDEX.push({t:'crop',n,sub:label,
      meta:[[kind==='seed'?'Buy seed in / plant in':'Where',where],
            ['Seed cost',cost?coin(cost)+' coins':null],
            ['Grow time',time==='—'?null:time],
            ['Yield',yld?yld+' per harvest':null],
            ['Sells',sell?coin(sell)+' coins':null],
            ['Energy',en?'+'+coin(en):null]],
      val:{sell:sell,energy:en,cost:cost},s:(n+' '+where+' '+label+' seed crop plant').toLowerCase()});
  });
  RECIPES.forEach(([n,reg,course,ing,sell,en,st])=>INDEX.push({
    t:'recipe',n,sub:course+' · '+reg,ing,
    meta:[['Stars','★'.repeat(st)],['Sells',sell?coin(sell)+' coins':null],['Energy',en?'+'+coin(en):null]],
    val:{sell:sell,energy:en,stars:st},s:(n+' '+ing+' '+course+' '+reg+' recipe meal').toLowerCase()
  }));
  ITEMS.forEach(([n,cat,where,sell,en])=>INDEX.push({
    t:'item',n,sub:cat,
    meta:[['Where',where],['Sells',sell?coin(sell)+' coins':null],['Energy',en?'+'+coin(en):null]],
    val:{sell:sell,energy:en},s:(n+' '+cat+' '+where+' ingredient').toLowerCase()}));
  CHARS.forEach(c=>{ if(!GIFTS[c.id]) return;
    INDEX.push({t:'gift',n:c.n+' — favourite gifts',sub:'Gift pool',ing:GIFTS[c.id],
      meta:[['Rotates','3 random picks from this pool each day']],
      s:(c.n+' gift gifts favourite favorite '+GIFTS[c.id]).toLowerCase()});
  });
  GEMS.forEach(([n,kind,where,sell,shiny])=>INDEX.push({
    t:'gem',n,sub:kind,
    meta:[['Where',where],['Sells',sell?coin(sell)+' coins':null],['Shiny',shiny?coin(shiny)+' coins':null]],
    val:{sell:sell,shiny:shiny},s:(n+' '+kind+' '+where+' mining ore gem').toLowerCase()}));
  CRITTERS.forEach(([n,bio,fav,liked,vars,how])=>INDEX.push({
    t:'critter',n,sub:'Critter',ing:vars||null,
    meta:[['Where',bio],['Favourite',fav||null],['Also likes',liked||null],['Taming',how||null]],
    s:(n+' critter companion '+bio+' '+fav+' '+liked+' '+vars).toLowerCase()}));
  const temArea=nome=>{
    const k=Object.keys(E.areas||{}).find(x=>x.endsWith('|'+nome));
    return k===undefined ? null : !!E.areas[k];
  };
  FLOWERS.forEach(([n,cs,onde,sell])=>{
    const st=onde.map(temArea);
    const pode = st.some(x=>x===true) ? 'yes \u2014 in a biome you have'
               : st.every(x=>x===null) ? null : 'not yet \u2014 biome still locked';
    INDEX.push({t:'flower',n,sub:'Flower \u00b7 '+cs.join(', '),
      meta:[['Where',onde.join(' \u00b7 ')],['Can you pick it',pode],['Sells',sell?coin(sell)+' coins':null]],
      val:{sell:sell},
      s:(n+' '+cs.map(c=>c+' flower').join(' ')+' flowers '+onde.join(' ')).toLowerCase()});
  });
  MATERIALS.forEach(([n,onde,sell,note])=>INDEX.push({
    t:'material',n,sub:'Crafting material',
    meta:[['Where',onde],['Sells',sell?coin(sell)+' coins':null],['Note',note||null]],
    val:{sell:sell},
    s:(n+' '+onde+' '+note+' material crafting').toLowerCase()}));
  CRAFT.forEach(([n,cat,rec,note])=>INDEX.push({
    t:'craft',n,sub:cat,ing:rec,
    meta:[['Note',note||null]],
    s:(n+' '+cat+' '+rec+' '+note+' craft crafting').toLowerCase()}));
  const jaHa=new Set([...RECIPES.map(r=>r[0]),...RECIPES_BASE.map(r=>r[0])].map(x=>x.toLowerCase()));
  RECIPES_NEW.filter(r=>!jaHa.has(r[0].toLowerCase())).forEach(([n,ing,st])=>INDEX.push({
    t:'recipe',n,sub:'Recipe',ing,
    meta:[['Stars','\u2605'.repeat(st)]],
    val:{stars:st},
    s:(n+' '+ing+' recipe meal').toLowerCase()}));
  QUESTREC.forEach(([n,ing,note])=>INDEX.push({
    t:'questrec',n,sub:'Quest-only recipe',ing,
    meta:[['Where',note]],
    s:(n+' '+ing+' '+note+' quest recipe one time').toLowerCase()}));
  TIPS.forEach(([n,txt])=>INDEX.push({
    t:'tip',n,sub:'Tip',ing:txt,meta:[],
    s:(n+' '+txt+' tip').toLowerCase()}));
  const jaTem=new Set(RECIPES.map(r=>r[0].toLowerCase()));
  RECIPES_BASE.forEach(([n,course,ing,st,sell,en])=>{
    if(jaTem.has(n.toLowerCase())) return;
    INDEX.push({t:'recipe',n,sub:course+' · Dreamlight Valley',ing,
      meta:[['Stars','★'.repeat(st)],['Sells',sell?coin(sell)+' coins':null],['Energy',en?'+'+coin(en):null]],
      val:{sell:sell,energy:en,stars:st},s:(n+' '+ing+' '+course+' dreamlight valley recipe meal').toLowerCase()});
  });
  CHARS.forEach(c=>c.q.forEach(q=>INDEX.push({    t:'quest',n:q,sub:'Friendship quest · '+c.n,link:wiki(q),
    meta:[['Character',c.n],['Franchise',c.f]],
    s:(q+' '+c.n+' '+c.f+' quest').toLowerCase()
  })));
}

let termoG='', tipoG='all';
const TIPOS=[['all','Everything'],['gift','Gifts'],['flower','Flowers'],['critter','Critters'],['material','Materials'],['gem','Ores & gems'],['craft','Crafting'],['questrec','Quest recipes'],['tip','Tips'],['item','Ingredients'],['fish','Fish'],['crop','Seeds & crops'],['recipe','Recipes'],['quest','Quests']];

function verFiltrosG(){
  document.getElementById('filtrosG').innerHTML=TIPOS.map(([k,r])=>
    `<button class="chip" data-t="${k}" aria-pressed="${tipoG===k}">${r}</button>`).join('');
  document.querySelectorAll('#filtrosG .chip').forEach(b=>b.onclick=()=>{tipoG=b.dataset.t;verFiltrosG();verGuia();});
}

function verGuia(){
  const el=document.getElementById('lista-guia');
  const q=termoG.trim().toLowerCase();
  let r=INDEX.filter(i=>(tipoG==='all'||i.t===tipoG)&&(!q||i.s.includes(q)));
  if(!q&&tipoG==='all'){
    el.innerHTML=`<p class="nota" style="margin-bottom:14px">Type anything above — a fish, a seed, a dish, an ingredient, a biome or a quest name. Or pick a category.</p>
    <div class="caixa"><div class="numeros">
      <div><b>${ITEMS.length}</b><span>ingredients</span></div>
      <div><b>${GEMS.length}</b><span>ores &amp; gems</span></div>
      <div><b>${CRAFT.length}</b><span>crafting</span></div>
      <div><b>${FISH.length}</b><span>fish</span></div>
      <div><b>${CROPS.length}</b><span>seeds &amp; crops</span></div>
      <div><b>${INDEX.filter(i=>i.t==='recipe').length}</b><span>recipes</span></div>
    </div></div>
    <p class="nota">There is also an Ask Claude button — type a question instead of a keyword (“what sells for the most?”, “what can I cook with garlic?”) and it answers from this same data. Searching a colour with \u201cflower\u201d \u2014 \u201cred flower\u201d \u2014 shows every flower of that colour and whether you can pick it today. Searching a character's name brings up what they like as a gift. Searching an ingredient shows every dish that uses it — try "garlic" or "golden honey". Searching a biome shows everything you can get there — try "Dazzle Beach".</p>`;
    return;
  }
  r.sort((a,b)=>{
    const an=a.n.toLowerCase().startsWith(q)?0:1, bn=b.n.toLowerCase().startsWith(q)?0:1;
    return an-bn || a.n.localeCompare(b.n);
  });
  const total=r.length;
  r=r.slice(0,120);
  if(!total){ el.innerHTML='<p class="vazio">Nothing found. Try a shorter word.</p>'; return; }
  el.innerHTML=`<p class="nota" style="margin-bottom:10px">${total} result${total>1?'s':''}${total>120?' — showing the first 120':''}</p>`+
  r.map(i=>`<div class="g">
    <div class="g-topo"><b>${esc(i.n)}</b><span class="tag ${i.t}">${esc(i.sub)}</span></div>
    ${i.ing?`<div class="g-ing">${esc(i.ing)}</div>`:''}
    <div class="g-meta">${i.meta.filter(m=>m[1]).map(m=>`${m[0]}: <em>${esc(m[1])}</em>`).join(' &nbsp;·&nbsp; ')}</div>
    ${i.link?`<div class="g-meta"><a href="${i.link}" target="_blank" rel="noopener">open on the wiki</a></div>`:''}
  </div>`).join('');
}

function verProg(){
  const el=document.getElementById('v-prog');
  const totA=AREAS.reduce((s,g)=>s+g.itens.length,0);
  const okA=Object.values(E.areas).filter(Boolean).length;
  const okP=CHARS.filter(c=>E.pers[c.id].on).length;
  const totQ=CHARS.filter(c=>E.pers[c.id].on).reduce((s,c)=>s+c.q.length,0);
  const okQ=CHARS.filter(c=>E.pers[c.id].on).reduce((s,c)=>s+c.q.filter(t=>E.pers[c.id].q[t]===1).length,0);
  const dez=CHARS.filter(c=>E.pers[c.id].on&&E.pers[c.id].lvl===10).length;
  const fnCont={};
  CHARS.filter(c=>E.pers[c.id].on&&E.pers[c.id].fn!=='—').forEach(c=>{
    fnCont[E.pers[c.id].fn]=(fnCont[E.pers[c.id].fn]||0)+1;
  });
  el.innerHTML=`
  <div class="caixa"><div class="numeros">
    <div><b>${okA}/${totA}</b><span>areas unlocked</span></div>
    <div><b>${okP}/${CHARS.length}</b><span>characters</span></div>
    <div><b>${dez}</b><span>at level 10</span></div>
  </div></div>
  <div class="caixa">
    <h2 class="secao" style="margin:0 0 4px">Friendship quests<span class="conta">${okQ} of ${totQ}</span></h2>
    <div class="barra"><i style="width:${totQ?Math.round(okQ/totQ*100):0}%"></i></div>
    <p class="nota" style="margin-top:10px">Counts only characters you've unlocked.</p>
  </div>
  <div class="caixa">
    <h2 class="secao" style="margin:0 0 8px">Companion roles</h2>
    ${Object.keys(fnCont).length
      ? FUNCOES.slice(1).filter(f=>fnCont[f]).map(f=>`<div class="missao"><label>${f}</label><span style="margin-left:auto;color:var(--ouro)">${fnCont[f]}</span></div>`).join('')
      : '<p class="nota">No roles recorded yet. Open a character and pick one under "Companion role" — worth spreading them around.</p>'}
  </div>
  ${DBREF ? '' : `<div class="caixa">
    <h2 class="secao" style="margin:0 0 8px">Spreadsheet sync</h2>
    ${gsAtivo
      ? '<p class="nota">Connected. Every tick is written to your Google spreadsheet, and this page checks for changes from your other devices every 20 seconds.</p>'
      : `<div class="linha"><button class="botao cheio" id="gsBtn">Connect to my spreadsheet</button></div>
         <p class="nota">Without this, your ticks live only in this browser. Connecting stores them in your own Google spreadsheet so phone and computer stay in step. You will be asked once for the password you set in the script.</p>`}
  </div>`}
  <div class="caixa">
    <h2 class="secao" style="margin:0 0 8px">Your data</h2>
    <div class="linha">
      <button class="botao cheio" id="exportar">Copy backup</button>
      <button class="botao" id="importar">Paste backup</button>
      ${(function(){ try{ return localStorage.getItem('my-valley-resgate') ? '<button class="botao" id="resgatar">Undo the last sync</button>' : ''; }catch(e){ return ''; } })()}
    </div>
    <div id="areaBackup" class="oculto">
      <textarea class="caixa-texto" id="txtBackup" placeholder="Paste the backup text here" spellcheck="false"></textarea>
      <div class="linha" style="margin-top:8px">
        <button class="botao cheio" id="restaurar">Restore from this text</button>
        <button class="botao" id="fecharBackup">Close</button>
      </div>
    </div>
    <p class="nota">${DBREF ? 'Your ticks are saved on the server for this artifact. They survive a reload, and any device signed in with the same account updates live \u2014 no refresh needed. The backup below is still a good safety net.' : 'Saving to the server is unavailable in this view, so your ticks live only in this browser and may be lost. Copy the backup and keep it somewhere.'}</p>
  </div>
  <div class="caixa">
    <h2 class="secao" style="margin:0 0 8px">About the data</h2>
    <p class="nota">Friendship quests come from the Dreamlight Valley Wiki. Fish and recipes from Dexerto's DDV wiki; seeds and crops from Destructoid, CharlieIntel and ScreenRant. Pulled September 2026.<br><br>
    The fish list is complete. Seeds cover the base game plus Storybook Vale. Food recipes now cover everything the community has documented, including every expansion and seasonal dish. Sell price and energy are filled in for the base-game and expansion dishes; the newer ones carry ingredients and star rating only. Base-game figures come from Nintendo Life's recipe list. Gift pools, ingredient spots, ores, gems and critters come from the Dreamlight Valley Wiki, GameSpot, Prima Games, Destructoid and TheGamer. Critter schedules cover the Valley, Storybook Vale and Wishblossom critters; geese and sweet bees are still listed by biome only. Gift pools only exist for 27 characters so far — the wiki page is still a stub. Crafting covers every refined material, every potion and training manual, the fences and paving, and the functional items. Decorative furniture blueprints — several hundred of them — are still not in here.</p>
  </div>`;
  const rg=document.getElementById('resgatar');
  if(rg) rg.onclick=()=>{
    try{
      const t=localStorage.getItem('my-valley-resgate');
      if(!t) return;
      if(!confirm('Bring back what was on this device just before the last sync?')) return;
      E=JSON.parse(t); completar(); salvar(); verTudo();
      alert('Restored. It has also been written back to the spreadsheet.');
    }catch(e){ alert('Could not restore.'); }
  };
  const gsb=document.getElementById('gsBtn');
  if(gsb) gsb.onclick=gsConectar;
  const area=document.getElementById('areaBackup');
  const txt=document.getElementById('txtBackup');
  document.getElementById('fecharBackup').onclick=()=>area.classList.add('oculto');
  document.getElementById('exportar').onclick=async()=>{
    const t=JSON.stringify(E);
    txt.value=t; area.classList.remove('oculto');
    try{ await navigator.clipboard.writeText(t); alert('Backup copied. It is also in the box below, in case you want to keep it somewhere.'); }
    catch(e){ txt.select(); alert('Could not reach the clipboard. Select the text in the box below and copy it by hand.'); }
  };
  document.getElementById('importar').onclick=()=>{
    txt.value=''; area.classList.remove('oculto');
    txt.focus();
    area.scrollIntoView({block:'center'});
  };
  document.getElementById('restaurar').onclick=()=>{
    const t=(txt.value||'').trim();
    if(!t){ alert('The box is empty. Paste the backup text first.'); return; }
    let novo;
    try{ novo=JSON.parse(t); }
    catch(e){ alert('That text is not a valid backup. Make sure you pasted all of it, from the first { to the last }.'); return; }
    if(!novo || !novo.pers){ alert('That text does not look like a My Valley backup.'); return; }
    guardaResgate();
    E=novo; completar(); salvar(); verTudo();
    area.classList.add('oculto');
    alert('Restored: '+riqueza(E)+' marks are back.');
  };
}

/* ---------- ask Claude ---------- */
let SAMPLE=null;
(async()=>{
  try{ SAMPLE = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }
  catch(e){ SAMPLE=null; }
  if(SAMPLE) atualizaAsk();
})();
function atualizaAsk(){
  const w=document.getElementById('askWrap');
  w.classList.toggle('oculto', !(SAMPLE && termoG.trim().length>2));
}
const compacto=i=>({name:i.n,kind:i.t,about:i.sub,detail:i.ing||'',
  info:i.meta.filter(m=>m[1]).map(m=>m[0]+': '+m[1]).join(' · '),
  sell:(i.val&&i.val.sell)||null,energy:(i.val&&i.val.energy)||null,
  shiny:(i.val&&i.val.shiny)||null,seedCost:(i.val&&i.val.cost)||null});
const TOOLS=[
 {name:'search_guide',
  description:"Search the game database by keyword. Optional kind filter: fish, crop, recipe, item, gem, critter, gift, craft, quest.",
  inputSchema:{type:'object',properties:{query:{type:'string'},kind:{type:'string'}},required:['query']},
  execute:({query,kind})=>{
    const q=String(query||'').toLowerCase();
    return INDEX.filter(i=>(!kind||i.t===kind)&&i.s.includes(q)).slice(0,20).map(compacto);}},
 {name:'rank',
  description:"Rank entries by a number. by: sell (star coins) or energy. order: desc (default) or asc. Optional kind filter as in search_guide.",
  inputSchema:{type:'object',properties:{kind:{type:'string'},by:{type:'string'},order:{type:'string'},limit:{type:'number'}},required:['by']},
  execute:({kind,by,order,limit})=>{
    const k=(by==='energy')?'energy':'sell';
    const r=INDEX.filter(i=>(!kind||i.t===kind)&&i.val&&i.val[k]);
    r.sort((a,b)=>order==='asc'?a.val[k]-b.val[k]:b.val[k]-a.val[k]);
    return r.slice(0,limit||10).map(compacto);}}
];
function caixaResposta(txt){
  return '<div class="caixa"><div style="font-size:13px;line-height:1.6;white-space:pre-wrap" id="askTxt"></div></div>';
}
async function perguntar(){
  const q=termoG.trim(); if(!q||!SAMPLE) return;
  const out=document.getElementById('askOut');
  const btn=document.getElementById('askBtn');
  btn.disabled=true; btn.textContent='Thinking…';
  out.innerHTML=caixaResposta();
  const alvo=document.getElementById('askTxt');
  try{
    const r=await SAMPLE([{role:'user',content:
"You are the assistant inside a Disney Dreamlight Valley companion app. Answer the player's question using ONLY the search_guide and rank tools. Never invent an item, price, location or recipe — if the tools return nothing useful, say the guide does not cover it. Keep the answer under 100 words, plain sentences, no headings or bullet symbols. Name concrete items and their numbers. Reply in the same language the question is written in.\n\nQuestion: "+q}],
      {tools:TOOLS, modelTier:'default',
       onText:({text})=>{ alvo.textContent=text; }});
    alvo.textContent=r.text;
  }catch(e){
    alvo.textContent = (e&&e.code==='not_granted')
      ? 'You declined the permission, so I cannot answer here.'
      : (e&&e.code==='rate_limited') ? 'Too many questions at once — try again in a minute.'
      : 'Could not answer right now.';
  }
  btn.disabled=false; btn.textContent='Ask Claude about this';
}

function verTudo(){ try{ document.getElementById('ordem').value=(E.ui&&E.ui.ordem)||'jogo'; }catch(e){} pintaToggle(); montarIndice(); verAreas(); verFiltros(); verPers(); verMiss(); verFiltrosG(); verGuia(); verProg(); }
document.querySelectorAll('.aba').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.aba').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['areas','pers','miss','guia','prog'].forEach(v=>
    document.getElementById('v-'+v).classList.toggle('oculto',v!==b.dataset.v));
  if(b.dataset.v==='miss') verMiss();
  if(b.dataset.v==='prog') verProg();
  window.scrollTo(0,0);
});
function pintaToggle(){
  const b=document.getElementById('soLiberados');
  const on=!!E.ui.soLiberados;
  b.setAttribute('aria-pressed', on?'true':'false');
  b.textContent = on ? 'Showing only what I unlocked' : "Hide the ones I haven't unlocked";
}
document.getElementById('soLiberados').onclick=()=>{
  E.ui.soLiberados=!E.ui.soLiberados; salvar(); pintaToggle(); verPers();
};
document.getElementById('ordem').onchange=e=>{ E.ui.ordem=e.target.value; salvar(); verPers(); };
document.getElementById('busca').oninput=e=>{termo=e.target.value;verPers();};
document.getElementById('buscaG').oninput=e=>{
  termoG=e.target.value; verGuia();
  document.getElementById('askOut').innerHTML=''; atualizaAsk();
};
document.getElementById('askBtn').onclick=perguntar;

carregar(); verTudo();
</script>
